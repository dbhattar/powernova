# PowerNOVA - Nginx Configuration (Dual App - Local Development)
# Serves both vanilla JS and React apps side-by-side

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # React app - serve from /react/* routes
    location /react {
        alias /usr/share/nginx/html/react;
        try_files $uri $uri/ /react/index.html;
        
        # CORS headers for API calls (if needed)
        add_header Access-Control-Allow-Origin * always;
        
        # Disable caching for local development
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Vanilla JS app (existing routes - default)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # DISABLE caching for local development - always fetch fresh files
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Disable .git directory access
    location ~ /\.git {
        deny all;
    }
}
