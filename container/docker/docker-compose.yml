version: '3.8'

# Local development environment for PowerNOVA
# Note: This is ONLY for local testing. Azure deployment uses separate App Services.
# Uses Dockerfile.local and Dockerfile.app.local which inject local config.

services:
  # PowerNOVA Landing Page (www.powernova.ai)
  powernova-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.local  # Local development Dockerfile
    container_name: powernova-website
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "com.powernova.description=PowerNOVA landing page (local)"
      - "com.powernova.version=1.0.0"
      - "com.powernova.subdomain=www"
      - "com.powernova.environment=local"
    networks:
      - powernova-network

  # PowerNOVA Chat App (app.powernova.ai)
  powernova-chat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app.local  # Local development Dockerfile
    container_name: powernova-chat-app
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "com.powernova.description=PowerNOVA chat interface (local)"
      - "com.powernova.version=1.0.0"
      - "com.powernova.subdomain=app"
      - "com.powernova.environment=local"
    networks:
      - powernova-network

  # PowerNOVA API Backend (api.powernova.ai)
  powernova-api:
    build:
      context: ../api
      dockerfile: ../docker/Dockerfile.api.local  # Local development Dockerfile
    container_name: powernova-api
    ports:
      - "8000:8000"
    env_file:
      - ../api/.env  # Load environment variables from .env file
    environment:
      # Override/add specific variables (these take precedence over env_file)
      - PORT=8000
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://powernova:powernova_dev_2024@powernova-postgres:5432/powernova
      - WORKER_MODE=api  # API only mode - no background workers
    restart: unless-stopped
    depends_on:
      powernova-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.powernova.description=PowerNOVA API backend (local)"
      - "com.powernova.version=1.0.0"
      - "com.powernova.subdomain=api"
      - "com.powernova.environment=local"
    volumes:
      - ../api:/app  # Mount for hot-reload during development
    networks:
      - powernova-network

  # Crawler Worker - Processes crawl jobs in background
  powernova-crawler-worker:
    build:
      context: ../api
      dockerfile: ../docker/Dockerfile.api.local  # Same image as API
    container_name: powernova-crawler-worker
    command: ["python3", "workers/crawler_worker.py"]  # Override to run worker
    env_file:
      - ../api/.env
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://powernova:powernova_dev_2024@powernova-postgres:5432/powernova
      - WORKER_ID=crawler-worker-local
      - POLL_INTERVAL=30
    restart: unless-stopped
    depends_on:
      powernova-postgres:
        condition: service_healthy
      powernova-api:
        condition: service_healthy
    labels:
      - "com.powernova.description=PowerNOVA crawler worker (local)"
      - "com.powernova.version=1.0.0"
      - "com.powernova.environment=local"
      - "com.powernova.type=worker"
    volumes:
      - ../api:/app  # Mount for hot-reload during development
    networks:
      - powernova-network

  # Document Worker - Generates embeddings in background
  powernova-doc-worker:
    build:
      context: ../api
      dockerfile: ../docker/Dockerfile.api.local  # Same image as API
    container_name: powernova-doc-worker
    command: ["python3", "workers/doc_worker.py"]  # Override to run worker
    env_file:
      - ../api/.env
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://powernova:powernova_dev_2024@powernova-postgres:5432/powernova
      - WORKER_ID=doc-worker-local
      - DOC_PROCESSOR_POLL_INTERVAL=10
      - DOC_PROCESSOR_BATCH_SIZE=10
    restart: unless-stopped
    depends_on:
      powernova-postgres:
        condition: service_healthy
      powernova-api:
        condition: service_healthy
    labels:
      - "com.powernova.description=PowerNOVA document worker (local)"
      - "com.powernova.version=1.0.0"
      - "com.powernova.environment=local"
      - "com.powernova.type=worker"
    volumes:
      - ../api:/app  # Mount for hot-reload during development
    networks:
      - powernova-network

  # PostgreSQL Database with pgvector extension
  # NOTE: Database is NOT exposed externally - only accessible via internal network
  # API service connects via: powernova-postgres:5432
  powernova-postgres:
    image: pgvector/pgvector:pg16
    container_name: powernova-postgres
    environment:
      - POSTGRES_DB=powernova
      - POSTGRES_USER=powernova
      - POSTGRES_PASSWORD=powernova_dev_2024
      - PGDATA=/var/lib/postgresql/data/pgdata
    # NO external port mapping - database is private to the network
    # ports:
    #   - "5432:5432"  # REMOVED: Not exposed to host machine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../api/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powernova -d powernova"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "com.powernova.description=PostgreSQL database (local, internal only)"
      - "com.powernova.version=16"
      - "com.powernova.environment=local"
      - "com.powernova.access=internal-only"
    networks:
      - powernova-network

networks:
  powernova-network:
    driver: bridge
    name: powernova-network

volumes:
  postgres_data:
    driver: local
    name: powernova_postgres_data

# Security Notes:
# ================
# 1. PostgreSQL is NOT exposed to the host machine (no port mapping)
# 2. Database is only accessible via the internal 'powernova-network'
# 3. Only the 'powernova-api' and worker services can connect to the database
# 4. All services are on the same network for inter-service communication
# 5. External access:
#    - Website: http://localhost:8080
#    - Chat App: http://localhost:8081
#    - API: http://localhost:8000
#    - Database: NOT accessible from host (internal only)
#    - Workers: Background processes (no ports exposed)
#
# To connect to database for debugging (from within the API container):
#   docker exec -it powernova-api psql -h powernova-postgres -U powernova -d powernova
#
# Or directly in the database container:
#   docker exec -it powernova-postgres psql -U powernova -d powernova
#
# To view worker logs:
#   docker logs -f powernova-crawler-worker
#   docker logs -f powernova-doc-worker

# Architecture:
# =============
# - powernova-web: Landing page (port 8080)
# - powernova-chat: Chat interface (port 8081)
# - powernova-api: REST API (port 8000, WORKER_MODE=api)
# - powernova-crawler-worker: Background crawl job processor
# - powernova-doc-worker: Background document/embedding processor
# - powernova-postgres: PostgreSQL database with pgvector (internal only)
#
# All containers communicate via powernova-network for local development
# Frontend (localhost:8081) calls API (localhost:8000)
# API and workers connect to PostgreSQL via internal network (powernova-postgres:5432)
# Production uses separate Azure App Services with managed PostgreSQL and ACI workers
