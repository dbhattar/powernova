version: '3.8'

# Local development environment for PowerNOVA
# Note: This is ONLY for local testing. Azure deployment uses separate App Services.
# Uses Dockerfile.local and Dockerfile.app.local which inject local config.

services:
  # PowerNOVA Landing Page (www.powernova.ai)
  powernova-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.local  # Local development Dockerfile
    container_name: powernova-website
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "com.powernova.description=PowerNOVA landing page (local)"
      - "com.powernova.version=1.0.0"
      - "com.powernova.subdomain=www"
      - "com.powernova.environment=local"

  # PowerNOVA Chat App (app.powernova.ai)
  powernova-chat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app.local  # Local development Dockerfile
    container_name: powernova-chat-app
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "com.powernova.description=PowerNOVA chat interface (local)"
      - "com.powernova.version=1.0.0"
      - "com.powernova.subdomain=app"
      - "com.powernova.environment=local"

  # PowerNOVA API Backend (api.powernova.ai)
  powernova-api:
    build:
      context: ../api
      dockerfile: ../docker/Dockerfile.api.local  # Local development Dockerfile
    container_name: powernova-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PORT=8000
      - ENVIRONMENT=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.powernova.description=PowerNOVA API backend (local)"
      - "com.powernova.version=1.0.0"
      - "com.powernova.subdomain=api"
      - "com.powernova.environment=local"
    volumes:
      - ../api:/app  # Mount for hot-reload during development

# Note: Containers communicate via host network for local development
# Frontend (localhost:8081) calls API (localhost:8000)
# Production uses separate Azure App Services with custom domains
