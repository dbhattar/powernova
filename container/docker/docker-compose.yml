version: '3.8'

services:
  powernova-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: powernova-website
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "com.powernova.description=PowerNOVA landing page"
      - "com.powernova.version=1.0.0"
